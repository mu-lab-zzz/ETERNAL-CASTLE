<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>BLOCK CRAFT - 3D積み木アプリ</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- ── HUD ── -->
  <div id="hud">

    <!-- クロスヘア -->
    <div id="crosshair">＋</div>

    <!-- ステータスバー（上） -->
    <div id="topbar">
      <div id="block-count">ブロック: 0</div>
      <div id="app-title">BLOCK CRAFT</div>
      <button id="btn-menu" aria-label="メニュー">☰</button>
    </div>

    <!-- モードボタン（左側） -->
    <div id="mode-panel">
      <button id="btn-navigate" class="mode-btn" title="移動">
        <span>👁</span><small>移動</small>
      </button>
      <button id="btn-build" class="mode-btn active" title="ブロック配置">
        <span>🧱</span><small>配置</small>
      </button>
      <button id="btn-erase" class="mode-btn" title="削除">
        <span>🗑</span><small>削除</small>
      </button>
      <div class="mode-divider"></div>
      <button id="btn-rotate" class="mode-btn" title="回転">
        <span>🔄</span><small id="rot-label">0°</small>
      </button>
      <button id="btn-grid" class="mode-btn" title="グリッド">
        <span>⊞</span><small>グリッド</small>
      </button>
    </div>

    <!-- アクション（右下浮きボタン） -->
    <div id="build-actions" class="fab-group">
      <button id="btn-place" class="fab fab-place" aria-label="ここに置く">✚</button>
    </div>
    <div id="erase-actions" class="fab-group hidden">
      <button id="btn-erase-center" class="fab fab-erase" aria-label="削除">✕</button>
    </div>

    <!-- ── ボトムバー ── -->
    <div id="bottombar">

      <!-- タブ切り替え -->
      <div id="tab-bar">
        <button class="tab-btn active" data-tab="blocks">🧱 ブロック</button>
        <button class="tab-btn" data-tab="colors">🎨 色</button>
        <button class="tab-btn" data-tab="material">✨ 素材</button>
        <button class="tab-btn" data-tab="save">💾 保存</button>
      </div>

      <!-- タブコンテンツ -->
      <div id="tab-content">

        <div id="tab-blocks" class="tab-panel active">
          <div id="block-picker" class="picker-scroll"></div>
        </div>

        <div id="tab-colors" class="tab-panel">
          <div id="color-picker" class="color-grid"></div>
          <div id="selected-color" style="background:#e74c3c"></div>
        </div>

        <div id="tab-material" class="tab-panel">
          <div id="mat-picker" class="mat-row"></div>
        </div>

        <div id="tab-save" class="tab-panel">
          <div class="save-grid">
            <button id="btn-save">💾 保存</button>
            <button id="btn-load">📂 読込</button>
            <button id="btn-export">📤 書き出し</button>
            <button id="btn-import">📥 読み込み</button>
            <button id="btn-qr">🔳 QR共有</button>
            <button id="btn-screenshot">📷 撮影</button>
            <button id="btn-clear" class="danger">🗑 全消去</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ── モーダル ── -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <div id="modal-title"></div>
      <div id="modal-body"></div>
      <div id="modal-actions">
        <button id="modal-cancel">キャンセル</button>
        <button id="modal-confirm">OK</button>
      </div>
    </div>
  </div>

  <!-- ファイル入力（非表示） -->
  <input type="file" id="file-input" accept=".json" style="display:none" />

  <!-- ── スタート画面 ── -->
  <div id="splash">
    <div class="splash-deco deco-1">⬛</div>
    <div class="splash-deco deco-2">🟥</div>
    <div class="splash-deco deco-3">🟦</div>
    <div class="splash-deco deco-4">🟩</div>
    <div id="splash-content">
      <div class="splash-logo">
        <span class="logo-block b1">B</span>
        <span class="logo-block b2">L</span>
        <span class="logo-block b3">O</span>
        <span class="logo-block b4">C</span>
        <span class="logo-block b5">K</span>
      </div>
      <div class="splash-sub">CRAFT</div>
      <p class="splash-catch">スマホの中の、無限の積み木箱</p>
      <button id="btn-start">
        <span>▶</span> 作り始める
      </button>
      <p class="splash-hint">👆 タップでブロックを置く<br>✌ 2本指でズーム</p>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
      }
    }
  </script>
  <!-- QR code library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script type="module" src="src/main.js"></script>
  <script>
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + tab)?.classList.add('active');
      });
    });
  </script>
</body>
</html>
