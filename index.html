<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THE ENDLESS CASTLE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #000; overflow: hidden; font-family: 'Georgia', serif; touch-action: none; }
    #canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

    #ui {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
    }

    /* ─── Crosshair ─── */
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 20px; height: 20px;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(200,180,140,0.7);
    }
    #crosshair::before { width: 1px; height: 100%; left: 50%; top: 0; }
    #crosshair::after  { width: 100%; height: 1px; top: 50%; left: 0; }

    /* ─── Stats bar — TOP ─── */
    #stats {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; gap: 14px;
      padding: 10px 16px 8px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
    }
    .stat-row { display: flex; align-items: center; gap: 6px; }
    .bar-label {
      color: #907050; font-size: 9px; letter-spacing: 1.5px;
      text-transform: uppercase; white-space: nowrap;
    }
    .bar-track {
      width: 90px; height: 5px; background: rgba(0,0,0,0.5);
      border: 1px solid rgba(150,120,80,0.35);
    }
    .bar-fill { height: 100%; transition: width 0.2s; }
    #hp-fill   { background: #8b1a1a; }
    #st-fill   { background: #3a5a2a; }
    #mp-fill   { background: #1a2a6b; }
    /* wider bars on larger screens */
    @media (min-width: 480px) {
      .bar-track { width: 130px; }
      .bar-label { font-size: 10px; }
    }

    /* ─── Enemy HP — below stats ─── */
    #enemy-hp {
      position: absolute; top: 52px; left: 50%;
      transform: translateX(-50%);
      display: none; text-align: center;
    }
    #enemy-hp .name { color: #c8b08c; font-size: 11px; letter-spacing: 3px; margin-bottom: 5px; }
    #enemy-hp-track { width: 180px; height: 4px; background: rgba(0,0,0,0.6); border: 1px solid rgba(150,50,50,0.4); }
    #enemy-hp-fill  { height: 100%; background: #6b1a1a; transition: width 0.3s; }

    /* ─── Damage vignette ─── */
    #vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(80,0,0,0) 100%);
      transition: background 0.3s; pointer-events: none;
    }
    #vignette.hit {
      background: radial-gradient(ellipse at center, transparent 40%, rgba(120,0,0,0.6) 100%);
    }

    /* ─── Message ─── */
    #message {
      position: absolute; bottom: 140px; left: 50%;
      transform: translateX(-50%);
      color: #c8b08c; font-size: 13px; letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(200,160,80,0.5);
      opacity: 0; transition: opacity 0.5s;
      text-align: center; max-width: 340px; line-height: 1.7;
      pointer-events: none;
    }

    /* ─── Interact prompt ─── */
    #interact-prompt {
      position: absolute; bottom: 200px; left: 50%;
      transform: translateX(-50%);
      color: #7a6040; font-size: 11px; letter-spacing: 2px;
      opacity: 0; transition: opacity 0.3s; text-align: center;
      pointer-events: none;
    }

    /* ─── Inventory ─── */
    #inventory {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10,8,6,0.97);
      border: 1px solid rgba(150,120,80,0.3);
      padding: 24px; width: min(340px, 90vw);
      display: none; pointer-events: all;
      color: #a08060; max-height: 70vh; overflow-y: auto;
    }
    #inventory h2 { letter-spacing: 4px; font-size: 12px; margin-bottom: 16px; color: #c8b08c; }
    #inv-close {
      position: absolute; top: 14px; right: 16px;
      color: #5a4030; font-size: 18px; cursor: pointer;
    }
    .inv-item { padding: 8px 0; border-bottom: 1px solid rgba(80,60,40,0.3); font-size: 12px; }
    .inv-item .item-name { color: #c8b08c; }
    .inv-item .item-desc { color: #5a4830; font-size: 10px; margin-top: 3px; line-height: 1.5; }

    /* ─── Title screen ─── */
    #title-screen {
      position: fixed; inset: 0; background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100;
    }
    #title-screen h1 {
      color: #c8b08c; font-size: clamp(28px, 7vw, 48px); letter-spacing: 10px;
      text-shadow: 0 0 40px rgba(200,160,80,0.4);
      margin-bottom: 8px; text-align: center;
    }
    #title-screen .sub { color: #5a4830; font-size: 12px; letter-spacing: 5px; margin-bottom: 50px; }
    #title-screen .start-btn {
      color: #a08060; font-size: 13px; letter-spacing: 4px;
      border: 1px solid rgba(160,120,80,0.4); padding: 14px 44px;
      cursor: pointer; pointer-events: all; transition: all 0.3s;
    }
    #title-screen .start-btn:hover,
    #title-screen .start-btn:active {
      color: #e0c090; border-color: rgba(200,160,80,0.8);
      text-shadow: 0 0 20px rgba(200,160,80,0.5);
    }
    #title-screen .controls {
      position: absolute; bottom: 30px;
      color: #3a3020; font-size: 10px; letter-spacing: 1.5px;
      text-align: center; line-height: 2; padding: 0 20px;
    }

    /* ─── Death overlay ─── */
    #death-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 200; pointer-events: none; transition: background 2s;
    }
    #death-overlay.dead { background: rgba(0,0,0,0.9); pointer-events: all; }
    #death-overlay h2 {
      color: #6b1a1a; font-size: 28px; letter-spacing: 8px;
      opacity: 0; transition: opacity 2s;
    }
    #death-overlay.dead h2 { opacity: 1; }
    #death-overlay .restart {
      color: #5a3020; font-size: 12px; letter-spacing: 3px;
      margin-top: 30px; cursor: pointer;
      opacity: 0; transition: opacity 3s 1s;
    }
    #death-overlay.dead .restart { opacity: 1; }

    /* ═══════════════════════════════════════
       TOUCH CONTROLS
    ═══════════════════════════════════════ */
    #touch-controls {
      display: none; /* JS shows this on touch devices */
      position: fixed; inset: 0; z-index: 15; pointer-events: none;
    }

    /* ── Virtual joystick (left) ── */
    #joystick-zone {
      position: absolute; bottom: 28px; left: 24px;
      width: 130px; height: 130px;
      pointer-events: all; touch-action: none;
    }
    #joystick-outer {
      width: 130px; height: 130px; border-radius: 50%;
      border: 1px solid rgba(150,120,80,0.25);
      background: rgba(0,0,0,0.25);
      position: relative;
    }
    #joystick-knob {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 50px; height: 50px; border-radius: 50%;
      background: rgba(200,160,80,0.22);
      border: 1px solid rgba(200,160,80,0.45);
      transition: transform 0.05s;
      pointer-events: none;
    }

    /* ── Action buttons (bottom-right) ── */
    #action-btns {
      position: absolute; bottom: 28px; right: 18px;
      display: flex; flex-direction: column; align-items: flex-end;
      gap: 10px; pointer-events: all;
    }
    .act-row { display: flex; gap: 10px; align-items: center; }
    .act-btn {
      width: 58px; height: 58px; border-radius: 50%;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(150,120,80,0.35);
      color: #c8b08c; font-size: 11px; letter-spacing: 1px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none;
      touch-action: manipulation;
      flex-direction: column; gap: 2px;
      -webkit-user-select: none;
    }
    .act-btn:active { background: rgba(150,120,80,0.25); }
    .act-btn .icon { font-size: 20px; line-height: 1; }
    #btn-run {
      width: 48px; height: 48px; font-size: 10px;
    }
    #btn-run.active {
      background: rgba(80,120,60,0.4);
      border-color: rgba(80,150,60,0.6);
      color: #90c070;
    }

    /* ── Menu buttons (top-right) ── */
    #menu-btns {
      position: absolute; top: 46px; right: 14px;
      display: flex; gap: 8px; pointer-events: all;
    }
    .menu-btn {
      padding: 6px 12px;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(150,120,80,0.3);
      color: #907050; font-size: 10px; letter-spacing: 2px;
      cursor: pointer; user-select: none;
      touch-action: manipulation;
      -webkit-user-select: none;
    }
    .menu-btn:active { background: rgba(150,120,80,0.2); }

    /* ── Look zone label (fade-out hint) ── */
    #look-hint {
      position: absolute; top: 50%; right: 18%;
      transform: translateY(-50%);
      color: rgba(100,80,50,0.35); font-size: 10px; letter-spacing: 2px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- ─── HUD ─── -->
  <div id="ui">
    <div id="crosshair"></div>
    <div id="vignette"></div>

    <div id="stats">
      <div class="stat-row">
        <div class="bar-label">Life</div>
        <div class="bar-track"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div>
      </div>
      <div class="stat-row">
        <div class="bar-label">Stamina</div>
        <div class="bar-track"><div class="bar-fill" id="st-fill" style="width:100%"></div></div>
      </div>
      <div class="stat-row">
        <div class="bar-label">Magic</div>
        <div class="bar-track"><div class="bar-fill" id="mp-fill" style="width:100%"></div></div>
      </div>
    </div>

    <div id="enemy-hp">
      <div class="name" id="enemy-name">亡霊騎士</div>
      <div id="enemy-hp-track"><div id="enemy-hp-fill"></div></div>
    </div>

    <div id="message"></div>
    <div id="interact-prompt">[ E ] 調べる</div>

    <div id="inventory">
      <h2>— 所持品 —</h2>
      <div id="inv-close" onclick="document.getElementById('inventory').style.display='none'">✕</div>
      <div id="inv-list"></div>
    </div>
  </div>

  <!-- ─── Touch Controls ─── -->
  <div id="touch-controls">
    <!-- Left: virtual joystick -->
    <div id="joystick-zone">
      <div id="joystick-outer">
        <div id="joystick-knob"></div>
      </div>
    </div>

    <!-- Menu buttons -->
    <div id="menu-btns">
      <div class="menu-btn" id="btn-inv">持物</div>
      <div class="menu-btn" id="btn-map">地図</div>
    </div>

    <!-- Action buttons -->
    <div id="action-btns">
      <div class="act-row">
        <div class="act-btn" id="btn-interact">
          <span class="icon">🔍</span>
          <span>調べる</span>
        </div>
        <div class="act-btn" id="btn-magic">
          <span class="icon">🔮</span>
          <span>魔法</span>
        </div>
      </div>
      <div class="act-row">
        <div class="act-btn" id="btn-run">
          <span class="icon">💨</span>
          <span>走る</span>
        </div>
        <div class="act-btn" id="btn-attack">
          <span class="icon">⚔</span>
          <span>攻撃</span>
        </div>
      </div>
    </div>

    <div id="look-hint">視点</div>
  </div>

  <!-- ─── Title ─── -->
  <div id="title-screen">
    <h1>THE ENDLESS<br>CASTLE</h1>
    <div class="sub">― 終わりなき城 ―</div>
    <div class="start-btn" onclick="startGame()">旅を始める</div>
    <div class="controls" id="title-controls">
      WASD / 矢印キー ― 移動 &nbsp;|&nbsp; マウス ― 視点<br>
      左クリック ― 攻撃 &nbsp;|&nbsp; E ― 調べる / 扉を開く<br>
      I ― 所持品 &nbsp;|&nbsp; Shift ― 走る &nbsp;|&nbsp; Space ― 魔法
    </div>
  </div>

  <!-- ─── Death ─── -->
  <div id="death-overlay">
    <h2>― 死 ―</h2>
    <div class="restart" onclick="location.reload()">再び立つ</div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
